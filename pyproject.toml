[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "noisy-oscillator-inference"
version = "0.1.0"
description = "Inference tools for noisy oscillator data."
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "pandas",
]

[tool.setuptools.packages.find]
where = ["src"]
